name: Compare CI Repair and Pi on LCA tasks
# Manual-only paired comparison (eval/compare.py). Uses the DEEPSEEK_API_KEY secret;
# agents run in network-less containers that never receive it. See eval/README.md.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated usable LCA task IDs
        required: true
      repetitions:
        description: Repetitions per task and arm
        required: true
        default: '3'
permissions:
  contents: read
env:
  MSWEA_SILENT_STARTUP: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - id: select
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          echo "$TASKS" | grep -Eq '^[0-9]+(,[0-9]+)*$'
          echo "tasks=[$TASKS]" >> "$GITHUB_OUTPUT"

  compare:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Pi (pinned in eval/pi)
        run: |
          corepack enable pnpm
          cd eval/pi && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile --ignore-scripts
      - name: Free disk space for replay images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the PyPI wayback mirror used by the official LCA workflows
        run: |
          docker run -d --name pypi-wayback -p 8629:8080 ghcr.io/waleko/pypi-wayback
          for _ in $(seq 30); do
            curl -sf http://localhost:8629/2024-01-10/pip/ >/dev/null && exit 0
            sleep 2
          done
          docker logs pypi-wayback
          exit 1
      - name: Compare on task ${{ matrix.task }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LITELLM_MODEL_REGISTRY_PATH: config/deepseek-pricing.json
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          uv run --with pyarrow python eval/compare.py --output runs/compare \
            --network container:pypi-wayback --mirror http://localhost:8080 \
            --tasks ${{ matrix.task }} --repetitions "$REPETITIONS"
      - name: Keep results, patches and agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-task-${{ matrix.task }}
          path: |
            runs/compare/experiment.jsonl
            runs/compare/tasks/${{ matrix.task }}
            !runs/compare/tasks/${{ matrix.task }}/collection/repo
            !runs/compare/tasks/${{ matrix.task }}/**/candidate
            !runs/compare/tasks/${{ matrix.task }}/**/*.tar
          if-no-files-found: warn
          retention-days: 90

  summary:
    needs: compare
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: compare-task-*
          path: runs/artifacts
      - name: Summarize
        run: |
          mkdir -p runs/compare/tasks
          for dir in runs/artifacts/compare-task-*; do
            cp -r "$dir/tasks/." runs/compare/tasks/
            cat "$dir/experiment.jsonl" >> runs/compare/experiment.jsonl
          done
          uv run --with pyarrow python eval/compare.py --output runs/compare --summarize \
            | tee runs/compare/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compare-summary
          path: |
            runs/compare/summary.md
            runs/compare/experiment.jsonl
