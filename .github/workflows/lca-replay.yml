name: LCA replay (build, baseline, reference fix)
# Manual-only evaluation of eval/lca_replay.py; see eval/README.md. No model, no secrets.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: Comma-separated LCA task IDs (empty for all 68)
        required: false
        default: ''
permissions:
  contents: read
env:
  MSWEA_SILENT_STARTUP: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: select
        env:
          TASKS: ${{ inputs.tasks }}
        run: |
          tasks=$(uv run --with pyarrow python eval/lca_replay.py --list --output runs/lca "$TASKS")
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

  replay:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Free disk space for replay images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start the PyPI wayback mirror used by the official LCA workflows
        run: |
          docker network create lca
          docker run -d --name pypi-wayback --network lca -p 8629:8080 ghcr.io/waleko/pypi-wayback
          for _ in $(seq 30); do
            curl -sf http://localhost:8629/2024-01-10/pip/ >/dev/null && exit 0
            sleep 2
          done
          docker logs pypi-wayback
          exit 1
      - name: Replay task ${{ matrix.task }}
        run: |
          uv run --with pyarrow python eval/lca_replay.py --task ${{ matrix.task }} \
            --output runs/lca --network lca --mirror http://pypi-wayback:8080
      - name: Keep results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lca-task-${{ matrix.task }}
          path: |
            runs/lca/tasks/${{ matrix.task }}
            !runs/lca/tasks/${{ matrix.task }}/repo
            !runs/lca/tasks/${{ matrix.task }}/**/*.tar
          if-no-files-found: warn
          retention-days: 30

  summary:
    needs: replay
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: lca-task-*
          path: runs/lca/tasks
      - name: Summarize
        run: |
          for dir in runs/lca/tasks/lca-task-*; do mv "$dir" "runs/lca/tasks/${dir##*-}"; done
          uv run --with pyarrow python eval/lca_replay.py --summarize runs/lca/tasks \
            | tee runs/lca/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lca-summary
          path: runs/lca/summary.md
