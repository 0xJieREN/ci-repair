name: repair fixture (intentional failure)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce intentional interval bug
        working-directory: examples/buggy
        run: python -m unittest discover -s tests -k test_positive_interval
