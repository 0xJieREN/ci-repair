[project]
name = "ci-repair"
version = "0.1.0"
description = "A thin, independently verified CI repair pipeline around mini-SWE-agent"
requires-python = ">=3.12"
dependencies = ["mini-swe-agent==2.4.6"]

[project.scripts]
ci-repair = "ci_repair.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
